<h3>Modifier le héros</h3>

<form (submit)="$event.preventDefault(); save()">
  <input type="text" [formField]="heroForm.name" />
  
  <label class="checkbox-label">
    <input type="checkbox" [formField]="heroForm.actif" />
    Héros actif
  </label>

  <button type="submit">Enregistrer les modifications</button>
</form>
