<h2>{{ title }}</h2>

<div class="page">
  <ul class="heroes">
    @for (hero of heroesModel(); track hero.id) {
      <li>
        <button type="button" (click)="onSelect(hero)"
          [class.selected]="hero.id === selectedHeroModel()?.id">
          <span class="id">{{ hero.id }}</span>
          <span class="nom">{{ hero.name }}</span>
          <span class="classe">{{ hero.classe ?? '-' }}</span>
          <span class="actif">{{ hero.actif ? "&check;" : "&#10007;" }}</span>
        </button>
      </li>
    }
  </ul>

  <aside class="edition">
    @if (selectedHeroModel(); as hero) {
      <app-hero-edit-component [hero]="hero" (heroChange)="onHeroChange($event)" />
    } @else {
      <p>Aucun héros sélectionné</p>
    }
  </aside>
</div>
