@if (messageService.messages().length > 0) {
  <div class="toast-container">
    @for (message of messageService.messages(); track message; let i = $index) {
      <div class="toast-card">
        <span class="toast-text">{{ message }}</span>
        <button type="button" class="toast-close" (click)="removeMessage(i)">×</button>
      </div>
    }
  </div>
}
